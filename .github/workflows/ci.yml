name: CI

# One workflow, on every push to `main` and every pull request.
#
#   Lint ───────┐
#   TypeScript ─┼─ independent, always run
#   Build ──────┤  Lint / TypeScript / Build are the three required status checks
#   Test ───────┘  (see .github/rulesets/main.json)
#
# `Test` runs on every PR but is NOT yet a required check — promoting it is a
# deliberate action by the repository owner once it has proven stable, done by
# editing .github/rulesets/main.json and running scripts/apply-branch-rules.sh.
# Whatever is added there must always run: a path-filtered job must NOT be a
# required check, or a PR that does not touch those paths waits forever.
#
# No job here installs a browser. The vitest suites are pure modules plus
# Durable Objects under workerd; the visual pass is local, driven by
# qa-verifier against a running dev server.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: oxlint apps/web
        run: npx oxlint src
        working-directory: apps/web

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Root `test` runs three workspaces: apps/api under workerd via
      # @cloudflare/vitest-pool-workers, apps/web and apps/etl as pure
      # modules in a node environment. None needs a dev server, a browser,
      # the network, or the 5.6 GB tile dataset.
      - name: npm test
        run: npm test

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Same three commands AGENTS.md tells a contributor to run before pushing.
      - name: tsc -b apps/web
        run: npx tsc -b
        working-directory: apps/web
      - name: tsc --noEmit apps/api
        run: npx tsc --noEmit
        working-directory: apps/api
      # test/ is not in the deploy project's `include`, so it needs its own
      # project — without this the vitest sources are never type-checked.
      - name: tsc --noEmit apps/api tests
        run: npx tsc -p test/tsconfig.json --noEmit
        working-directory: apps/api

      - name: tsc --noEmit apps/etl
        run: npx tsc --noEmit
        working-directory: apps/etl

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Two independent deploy units, both validated here in one always-running
      # job. Do NOT split this into per-app jobs behind `paths:` filters: the
      # ruleset requires a check literally named `Build`, and a filtered job that
      # doesn't run leaves a PR waiting on it forever.
      #
      # apps/web/dist is siahra-web's `assets.directory`, so build web before its
      # dry-run. The API config no longer references dist at all.
      - name: Build apps/web
        run: npm run build -w apps/web
      - name: Bundle siahra-web (wrangler deploy --dry-run)
        run: npx wrangler deploy --dry-run --outdir=/tmp/siahra-web
        working-directory: apps/web
      - name: Bundle siahra-api (wrangler deploy --dry-run)
        run: npx wrangler deploy --dry-run --outdir=/tmp/siahra-api
        working-directory: apps/api
      - name: Asset-bundle limits (Workers static assets)
        # Cloudflare rejects deploys with > 20,000 files or any file > 25 MiB.
        # Fail here rather than at deploy time.
        run: |
          set -euo pipefail
          count=$(find apps/web/dist -type f | wc -l | tr -d ' ')
          big=$(find apps/web/dist -type f -size +25M | head -5)
          echo "dist files: $count"
          [ "$count" -le 20000 ] || { echo "::error::apps/web/dist has $count files (> 20,000 Workers asset limit)"; exit 1; }
          if [ -n "$big" ]; then echo "::error::files > 25 MiB in apps/web/dist:"; echo "$big"; exit 1; fi
