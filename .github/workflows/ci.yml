name: CI

# One workflow, on every push to `main` and every pull request.
#
#   Lint ───────────────┐
#   TypeScript ─────────┼─ independent, always run
#   Build ──────────────┤  Lint / TypeScript / Build are the three required
#   Detect affected ────┤  status checks (see .github/rulesets/main.json)
#     └─ Test (api, apps/api) ┐
#        Test (web, apps/web) ┼─ one leg per affected workspace, may be absent
#        Test (etl, apps/etl) ┘
#           └─ Test ──────────── aggregate gate, `if: always()`
#
# Lint, TypeScript and Build stay whole on purpose: the ruleset requires those
# three literal check names, and a job that does not run leaves a PR waiting on
# it forever. That is also why the per-workspace `Test (...)` legs are never
# required and the always-running `Test` gate exists — it reports pass/fail for
# whatever the matrix did, including "no workspace with tests was affected".
#
# `Test` runs on every PR but is NOT yet a required check — promoting it is a
# deliberate action by the repository owner, done by editing
# .github/rulesets/main.json and running scripts/apply-branch-rules.sh.
#
# No job here installs a browser. The vitest suites are pure modules plus
# Durable Objects under workerd; the visual pass is local, driven by
# qa-verifier against a running dev server.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # `worker/` too, not just `src`: worker/tilePath.ts is what rejects path
      # traversal in the tile URL, and it sat outside the lint gate until E9.2.
      # Note oxlint exits 0 on warnings, so this fails the build only on
      # error-level rules — the same contract `src` has always had here.
      - name: oxlint apps/web
        run: npx oxlint src worker
        working-directory: apps/web

  # Which workspaces does this change actually touch? The three test suites are
  # independent, so a PR that only edits apps/web has no reason to boot workerd
  # for apps/api. Anything shared (the lockfile, root package.json,
  # packages/shared-types — the api/web/etl data contract — or this workflow)
  # marks every workspace affected, because a shared change can break a suite
  # whose own files never moved.
  detect:
    name: Detect affected
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.affected.outputs.matrix }}
      any: ${{ steps.affected.outputs.any }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history: the diff base can be many commits back on a PR.
          fetch-depth: 0
      - id: affected
        env:
          # PR: the merge-base recorded by GitHub. Push to main: the previous
          # tip. Either can be missing or unreachable (a force push, the first
          # push of a branch) — that case runs every suite rather than none.
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          all=0
          if [ -z "${BASE:-}" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "no usable diff base ($BASE) — treating every workspace as affected"
            all=1
            changed=""
          else
            changed=$(git diff --name-only "$BASE" HEAD)
            echo "changed files vs $BASE:"
            printf '%s\n' "$changed"
            if printf '%s\n' "$changed" | grep -qE '^(package\.json|package-lock\.json|packages/|\.github/workflows/ci\.yml$)'; then
              echo "a shared path changed — every workspace is affected"
              all=1
            fi
          fi
          matrix='[]'
          for entry in api:apps/api web:apps/web etl:apps/etl; do
            name=${entry%%:*}
            path=${entry#*:}
            if [ "$all" = 1 ] || printf '%s\n' "$changed" | grep -q "^$path/"; then
              matrix=$(printf '%s' "$matrix" | jq -c --arg n "$name" --arg p "$path" '. + [{name: $n, path: $p}]')
            fi
          done
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          if [ "$(printf '%s' "$matrix" | jq 'length')" -gt 0 ]; then
            echo "any=true" >> "$GITHUB_OUTPUT"
          else
            echo "any=false" >> "$GITHUB_OUTPUT"
          fi
          printf '%s\n' "$matrix" | jq -r '.[] | "will run: Test (\(.name), \(.path))"'

  # One leg per affected workspace: `Test (api, apps/api)` and friends. These
  # names are generated, and a leg is absent when its workspace is untouched, so
  # none of them can ever be a required status check — that is what the `Test`
  # gate below is for.
  test-matrix:
    name: Test (${{ matrix.name }}, ${{ matrix.path }})
    needs: detect
    if: needs.detect.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.detect.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      # Root install: the workspaces depend on @siahra/shared-types through the
      # npm workspace link, so a per-workspace install would not resolve it.
      - run: npm ci
      # apps/api runs under workerd via @cloudflare/vitest-pool-workers;
      # apps/web and apps/etl are pure modules in a node environment. None
      # needs a dev server, a browser, the network, or the 5.6 GB tile dataset.
      - name: npm test -w ${{ matrix.path }}
        run: npm run test -w ${{ matrix.path }}

  # The one check that always reports, whatever the matrix did — including when
  # it was skipped because no workspace was affected. Promoting `Test` to a
  # required check in .github/rulesets/main.json therefore stays safe; the legs
  # themselves never can be.
  test:
    name: Test
    needs: [detect, test-matrix]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Gate on the affected suites
        env:
          DETECT: ${{ needs.detect.result }}
          MATRIX: ${{ needs.test-matrix.result }}
          ANY: ${{ needs.detect.outputs.any }}
        run: |
          set -euo pipefail
          if [ "$DETECT" != "success" ]; then
            echo "::error::Detect affected did not succeed ($DETECT) — cannot tell which suites to run"
            exit 1
          fi
          if [ "$ANY" != "true" ]; then
            echo "no workspace with tests was affected — nothing to run"
            exit 0
          fi
          case "$MATRIX" in
            success) echo "every affected suite passed" ;;
            *) echo "::error::a Test leg did not pass ($MATRIX)"; exit 1 ;;
          esac

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Same three commands AGENTS.md tells a contributor to run before pushing.
      - name: tsc -b apps/web
        run: npx tsc -b
        working-directory: apps/web
      - name: tsc --noEmit apps/api
        run: npx tsc --noEmit
        working-directory: apps/api
      # test/ is not in the deploy project's `include`, so it needs its own
      # project — without this the vitest sources are never type-checked.
      - name: tsc --noEmit apps/api tests
        run: npx tsc -p test/tsconfig.json --noEmit
        working-directory: apps/api

      - name: tsc --noEmit apps/etl
        run: npx tsc --noEmit
        working-directory: apps/etl

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Two independent deploy units, both validated here in one always-running
      # job. Do NOT split this into per-app jobs behind `paths:` filters: the
      # ruleset requires a check literally named `Build`, and a filtered job that
      # doesn't run leaves a PR waiting on it forever.
      #
      # apps/web/dist is siahra-web's `assets.directory`, so build web before its
      # dry-run. The API config no longer references dist at all.
      - name: Build apps/web
        run: npm run build -w apps/web
      - name: Bundle siahra-web (wrangler deploy --dry-run)
        run: npx wrangler deploy --dry-run --outdir=/tmp/siahra-web
        working-directory: apps/web
      - name: Bundle siahra-api (wrangler deploy --dry-run)
        run: npx wrangler deploy --dry-run --outdir=/tmp/siahra-api
        working-directory: apps/api
      - name: Asset-bundle limits (Workers static assets)
        # Cloudflare rejects deploys with > 20,000 files or any file > 25 MiB.
        # Fail here rather than at deploy time.
        run: |
          set -euo pipefail
          count=$(find apps/web/dist -type f | wc -l | tr -d ' ')
          big=$(find apps/web/dist -type f -size +25M | head -5)
          echo "dist files: $count"
          [ "$count" -le 20000 ] || { echo "::error::apps/web/dist has $count files (> 20,000 Workers asset limit)"; exit 1; }
          if [ -n "$big" ]; then echo "::error::files > 25 MiB in apps/web/dist:"; echo "$big"; exit 1; fi
